name: Fix Tab Order (one-off, restores Sheet1 to position 1)

# Sheet-only (no OnBuy calls), so it stays outside the onbuy-api group and
# can run immediately alongside anything.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore Sheet1 to position 1
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python fix_tab_order.py
