name: Orders vs List (read-only)

# Which SKUs of an explicit list are in OnBuy orders, and are those orders still open? Order id / status / dates / SKU only - never buyer details.
# Shares the OnBuy token with the sync, so it queues in the onbuy-api group.

on:
  workflow_dispatch:
    inputs:
      list_file:
        description: "Repo path: SKUs to look for (one per line)"
        required: true
      days:
        description: "How many days back to look"
        required: false
        default: "30"
      statuses:
        description: "Order status filters, comma-separated; empty entry = OnBuy's default (awaiting_dispatch), all = every status"
        required: false
        default: ",all"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Look up
        env:
          LIST_FILE: ${{ inputs.list_file }}
          DAYS: ${{ inputs.days }}
          STATUSES: ${{ inputs.statuses }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python -u orders_vs_list.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orders-vs-list
          path: |
            orders_hits.csv
            orders_open_skus.txt
          if-no-files-found: ignore
