name: Clear Sale Price (few listings)

# Removes the SALE price ("On Sale: GBP x" on the OnBuy dashboard) from the named listings: re-sends the SAME price and stock with an empty sale
# price and reads the listing back to prove it. dry_run=yes (default) only reports. Holds the onbuy-api group.

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "SKUs, comma-separated (max 20 per run)"
        required: true
      dry_run:
        description: "yes = report only; no = clear for real"
        required: false
        default: "yes"
      variant:
        description: "Force one spelling of 'no sale' (empty = try them in order)"
        required: false
        default: ""

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Clear
        env:
          SKUS: ${{ inputs.skus }}
          VARIANT: ${{ inputs.variant }}
          DRY_INPUT: ${{ inputs.dry_run }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: |
          if [ "$DRY_INPUT" = "no" ]; then export DRY_RUN=0; else export DRY_RUN=1; fi
          python clear_sale_price.py
