name: Revive Zeroed Listings (recovery, dry-run by default)

# Reverses the 2026-09-30 mass stock-zeroing (wrong-tab read by the deletion
# reconciler). Pushes to OnBuy, so it shares the onbuy-api group with every
# other OnBuy-touching workflow.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = plan only (nothing touched), no = restore stock + clear the queue"
        required: true
        default: "yes"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  revive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Revive
        env:
          DRY_RUN: ${{ inputs.dry_run == 'yes' && '1' || '0' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python revive_zeroed_listings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revive-results
          path: revive_results.csv
