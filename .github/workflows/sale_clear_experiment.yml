name: Sale Clear Experiment

# 2026-10-10: which listing-update spelling makes OnBuy drop a SALE price, and how long it takes. One update with a different spelling per
# listing (plan = "sku=variant,..."), then reads every listing back for ~5 minutes. dry_run=yes (default) only prints the updates. Holds the onbuy-api group.

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "sku=variant pairs, comma-separated (variants: ctrl, null, null_dates, dates_null, past, past_min, end_eq_start, price_eq)"
        required: true
      dry_run:
        description: "yes = print only; no = send the update"
        required: false
        default: "yes"
      polls:
        description: "seconds after the update to read the listings back, comma-separated"
        required: false
        default: "30,60,90,120,180,240,300"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Experiment
        env:
          PLAN: ${{ inputs.plan }}
          POLLS: ${{ inputs.polls }}
          DRY_INPUT: ${{ inputs.dry_run }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: |
          if [ "$DRY_INPUT" = "no" ]; then export DRY_RUN=0; else export DRY_RUN=1; fi
          python -u sale_clear_experiment.py
