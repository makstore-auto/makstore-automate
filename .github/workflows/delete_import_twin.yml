name: Delete Import Twin

on:
  workflow_dispatch:
    inputs:
      target_skus:
        description: "SKUs whose no-Supplier-URL imported twin row should be deleted"
        required: true
      dry_run:
        description: "yes = list; no = delete"
        required: false
        default: "yes"

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Delete
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_SKUS: ${{ inputs.target_skus }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python delete_import_twin.py
