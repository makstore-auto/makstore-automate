name: Rekey Rows

on:
  workflow_dispatch:
    inputs:
      rekey:
        description: "old:new SKU pairs, comma-separated"
        required: true
      dry_run:
        description: "yes = list; no = rekey"
        required: false
        default: "yes"

jobs:
  rekey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Rekey
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REKEY: ${{ inputs.rekey }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python rekey_rows.py
