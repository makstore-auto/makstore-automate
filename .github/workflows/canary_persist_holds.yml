name: Canary - hold commit (temporary, delete after the check)

on:
  workflow_dispatch:

concurrency:
  group: persist-canary
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write one fake hold the way the zero pass does
        run: python3 -c "import held_skus; print(held_skus.persist_holds([('0000000000000-canary-persist', 'canary row | canary page')]))"
      - name: Keep what the nightly zeroed at zero for good (commit the hold lists)
        run: |
          if [ -n "$(git status --porcelain -- protected_skus.txt hold_at_zero_skus.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- protected_skus.txt hold_at_zero_skus.txt
            git commit -m "nightly: keep the listings it zeroed at zero (protected_skus.txt + hold_at_zero_skus.txt)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep 6
            done
          else
            echo "no new holds to commit"
          fi
      - name: Prove the commit reached main
        run: |
          git fetch origin main
          git log origin/main -1 --format='%h %an %s'
          test "$(git show origin/main:protected_skus.txt | grep -c 0000000000000-canary-persist)" -ge 1
          test "$(git show origin/main:hold_at_zero_skus.txt | grep -c 0000000000000-canary-persist)" -ge 1
          echo "CANARY OK: the bot commit with the fake hold is on main"
