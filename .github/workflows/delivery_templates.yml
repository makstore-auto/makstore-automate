name: Delivery Templates (plan / test / apply)

# User 2026-10-13: every listing on the delivery template of its supplier - eBay rows on the eBay template, Amazon rows on the Amazon template; user
# 2026-10-14: the semi store's CSV uploads (AliExpress rows, named by the semi sheet) on the AliExpress template; legacy listings (no sheet row) stay put. plan = census + what would move (writes nothing); test = ONE listing's template through the API
# and a read-back (proves the field is accepted); apply = every listing off its template, in batches. See delivery_templates.py.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | test | apply"
        required: false
        default: "plan"
      template_ebay:
        description: "Delivery template id for eBay-sourced listings (empty = the DELIVERY_TEMPLATE_EBAY variable, else 35109)"
        required: false
        default: ""
      template_amazon:
        description: "Delivery template id for Amazon-sourced listings (empty = the DELIVERY_TEMPLATE_AMAZON variable, else 22069)"
        required: false
        default: ""
      template_ali:
        description: "Delivery template id for AliExpress-sourced listings (the semi store's uploads) (empty = the DELIVERY_TEMPLATE_ALI variable, else 43190)"
        required: false
        default: ""
      semi_sheet:
        description: "The semi store's sheet whose rows name the AliExpress-sourced SKUs (blank = full sheet only)"
        required: false
        default: "Makstore_Feed_Master"
      test_sku:
        description: "mode=test: the one SKU to move"
        required: false
        default: ""
      max_changes:
        description: "mode=apply: refuse when more listings than this would move"
        required: false
        default: "3000"
      clear_handling:
        description: "yes = also take a sheet-sourced listing's OWN handling time off (0 = the template decides); legacy listings untouched"
        required: false
        default: "no"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Delivery templates
        env:
          MODE: ${{ inputs.mode }}
          TEMPLATE_EBAY: ${{ inputs.template_ebay || vars.DELIVERY_TEMPLATE_EBAY || '35109' }}
          TEMPLATE_AMAZON: ${{ inputs.template_amazon || vars.DELIVERY_TEMPLATE_AMAZON || '22069' }}
          TEMPLATE_ALI: ${{ inputs.template_ali || vars.DELIVERY_TEMPLATE_ALI || '43190' }}
          SEMI_SHEET_NAME: ${{ inputs.semi_sheet }}
          TEST_SKU: ${{ inputs.test_sku }}
          MAX_CHANGES: ${{ inputs.max_changes }}
          CLEAR_HANDLING: ${{ inputs.clear_handling }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python -u delivery_templates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-template-plan
          path: |
            delivery_template_plan.csv
            handling_times.csv
          if-no-files-found: ignore
