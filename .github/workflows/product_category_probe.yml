name: Product Category Probe (read-only)

# Does any OnBuy API read expose the category of the product a listing sits on (the category that decides the commission)?
# Tries the documented product reads for the given SKUs and prints statuses, key names and every category-like key. Writes nothing.

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "Comma-separated SKUs to probe"
        required: true

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe product reads
        env:
          SKUS: ${{ inputs.skus }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python -u product_category_probe.py
